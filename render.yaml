# Render Blueprint: FastAPI backend (ARCHITECTURE §18) + the frontend static site.
# Secrets (sync: false) are set once in the Render dashboard, never committed here.
services:
  - type: web
    name: foodresq-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENVIRONMENT
        value: production
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: DEV_AUTH_ENABLED
        value: "false"
      - key: MATCHING_ENGINE
        value: bridge
      - key: TYPESAFE_JEV_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: INTERNAL_TICK_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: APP_JWT_SECRET
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: EMAIL_NOTIFICATIONS_ENABLED
        value: "true"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM_NAME
        sync: false
      - key: EMAIL_FROM
        sync: false

  - type: web
    name: foodresq-app
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_DEV_AUTH
        value: "false"
      - key: VITE_GOOGLE_LOGIN_ENABLED
        value: "true"
